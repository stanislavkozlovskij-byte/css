<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Чат</title>
    <style>
      /* 1. Центрируем чат на странице (наш любимый Flexbox) */
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        background-color: aliceblue; /* Светло-голубой фон */
        font-family: sans-serif;
      }

      /* 2. Контейнер чата */
      #chat-container {
        width: 350px;
        background: white;
        border: 2px solid hotpink; /* Розовая рамка */
        border-radius: 15px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      }

      /* 3. Окно сообщений */
      #messages {
        height: 400px;
        padding: 15px;
        overflow-y: auto; /* Прокрутка, если сообщений много */
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      /* 4. Стиль отдельного сообщения */
      .msg {
        padding: 8px 12px;
        border-radius: 10px;
        max-width: 80%;
        font-size: 0.9rem;
      }
      .user-msg {
        align-self: flex-end;
        background-color: hotpink; /* Розовый для своих */
        color: white;
      }

      /* 5. Поле ввода (форма) */
      #chat-form {
        display: flex;
        padding: 10px;
        border-top: 1px solid #eee;
        gap: 5px;
      }

      input {
        flex: 1;
        padding: 8px;
        border: 1px solid #ccc;
        border-radius: 5px;
        outline: none;
      }

      button {
        background-color: hotpink;
        color: white;
        border: none;
        padding: 8px 15px;
        border-radius: 5px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="chat-container">
      <div id="messages">
        <div class="msg" style="background: #e1f5fe">
          Привет! Как там в горах? 🏔️
        </div>
      </div>

      <!-- Форма отправки (то, что мы обсуждали) -->
      <form id="chat-form">
        <input
          type="text"
          id="user-input"
          placeholder="Напишите сообщение..."
          required
        />
        <button type="submit">Отправить</button>
      </form>
    </div>

    <script>
      // Логика работы чата на JS
      const form = document.getElementById("chat-form");
      const input = document.getElementById("user-input");
      const messagesDiv = document.getElementById("messages");

      form.onsubmit = (e) => {
        e.preventDefault(); // Чтобы страница не перезагружалась

        // Создаем новое сообщение
        const newMsg = document.createElement("div");
        newMsg.classList.add("msg", "user-msg");
        newMsg.textContent = input.value;

        // Добавляем в окно чата
        messagesDiv.appendChild(newMsg);

        // Очищаем поле ввода и крутим вниз
        input.value = "";
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
      };
    </script>
  </body>
</html>
